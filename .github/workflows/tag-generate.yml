name: Tag Generate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: ver
        run: |
          echo "version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create tag + changelog if missing
        shell: bash
        run: |
          set -euo pipefail
          VER="v${{ steps.ver.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$VER" >/dev/null; then
            echo "Tag $VER already exists; nothing to do"
            exit 0
          fi

          PREV=$(git tag --sort=-v:refname | grep -v "^$VER$" | head -1 || true)
          RANGE=""
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; fi

          if [ -n "$RANGE" ]; then
            BODY=$(git log "$RANGE" --no-merges --pretty=format:'- %s')
          else
            BODY=$(git log --no-merges --pretty=format:'- %s')
          fi
          if [ -z "$BODY" ]; then BODY="- No changes captured from git log."; fi

          touch CHANGELOG.md
          # keep older sections after the first version header
          OLDER=$(sed '1,/^## \[v[0-9]/d' CHANGELOG.md || true)

          {
            printf '# Changelog\n'
            printf '\nAll notable changes documented here. Generated per tag by tag-generate.yml.\n'
            printf '\n## [%s]\n\n%s\n' "$VER" "$BODY"
            if [ -n "$OLDER" ]; then printf '\n%s\n' "$OLDER"; fi
          } > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: changelog for $VER" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
          git tag -a "$VER" -m "Release $VER"
          git push origin "$VER"
          echo "Pushed tag $VER + changelog"