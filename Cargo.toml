[package]
name = "gh-opportunities"
version = "0.2.0"
edition = "2021"
description = "Find open source contribution opportunities on GitHub"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
octocrab = "0.44"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
comfy-table = "7"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.35", features = ["bundled"] }
dirs = "6"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
axum = "0.8"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
assert_cmd = "2"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
