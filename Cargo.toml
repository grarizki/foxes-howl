[package]
name = "gh-opportunities"
version = "0.1.0"
edition = "2021"
description = "Find open source contribution opportunities on GitHub"

[dependencies]
clap = { version = "4", features = ["derive"] }
octocrab = "0.44"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
comfy-table = "7"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
